# Deploy to GitHub Pages (Astro official action)
# 部署到 GitHub Pages，带缓存加速：pnpm 依赖缓存 + Astro/Vite 构建产物缓存。

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Caches the pnpm store, keyed on pnpm-lock.yaml
          # pnpm store 缓存，按 lockfile 变化自动失效
          cache: pnpm

      # Cache Astro generated types, Vite transform cache and the built
      # site, so unchanged sources skip type-gen, bundling and uploads.
      # Astro 类型生成 / Vite 缓存 / dist 产物缓存
      - name: Cache Astro build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .astro
            node_modules/.vite
            dist
          key: astro-${{ runner.os }}-${{ hashFiles('astro.config.mjs', 'pnpm-lock.yaml') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            astro-${{ runner.os }}-${{ hashFiles('astro.config.mjs', 'pnpm-lock.yaml') }}-
            astro-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check (astro check)
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Build site
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
